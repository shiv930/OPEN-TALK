<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Floating Ring -->
  <circle cx="50" cy="50" r="38" stroke="url(#orbitGlow)" stroke-width="3" stroke-dasharray="160 40" stroke-linecap="round" filter="url(#glow)" />
  <!-- Inner Floating Ring -->
  <circle cx="50" cy="50" r="26" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="70 30" stroke-linecap="round" opacity="0.8" />
  <!-- Suspended Core Nucleus -->
  <circle cx="50" cy="50" r="12" fill="url(#orbitGlow)" />
  <!-- Orbiting Satellite Node -->
  <circle cx="78" cy="30" r="4.5" fill="#06B6D4" filter="url(#glow)" />
</svg>
